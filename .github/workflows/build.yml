name: AERA Recovery 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "AERA manifest url"
        required: true
        default: "https://github.com/AERA-Recovery/android_manifest"
      TWRP_MANIFEST_BRANCH:
        description: "AERA branch"
        required: true
        default: "aera-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/cheng343/android_device_oneplus_giulia-AERA"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "oneplus/giulia"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "giulia"
      LUNCH_TARGET:
        description: "lunch target (e.g. giulia-bp2a-eng)"
        required: false
        default: "giulia-bp2a-eng"
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        TARGET="${{ github.event.inputs.LUNCH_TARGET }}"
        if [ -z "$TARGET" ]; then
          TARGET="${{ github.event.inputs.DEVICE_NAME }}-bp2a-eng"
        fi
        TARGET="${TARGET#twrp_}"
        if [[ "$TARGET" != *-*-* ]]; then
          if [[ "$TARGET" == *-* ]]; then
            DEV="${TARGET%%-*}"
            VAR="${TARGET##*-}"
            TARGET="${DEV}-bp2a-${VAR}"
          else
            TARGET="${TARGET}-bp2a-eng"
          fi
        fi
        echo "LUNCH_TARGET=${TARGET}" >> "$GITHUB_ENV"

        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${TARGET}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo "Supported devices:"
          echo "- OnePlus Ace 5 / 13R (CN: PKG110 / GL: CPH2645 / IN: CPH2647)"
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        # Measured on this runner image (ubuntu-24.04, westus3): /mnt is NOT a
        # separate disk, it lives on /dev/root, which is 145G with ~135G free
        # after the cleanup step. maximize-build-space therefore does:
        #   root_pv = free(/) - root-reserve-mb
        #   avail(/mnt) is now exactly root-reserve-mb
        #   temp_pv = root-reserve-mb - temp-reserve-mb   <-- so root-reserve-mb
        #                                                      MUST exceed
        #                                                      temp-reserve-mb,
        #                                                      otherwise fallocate
        #                                                      gets a negative size
        #                                                      (run #8 died here)
        #   build_lv = free(/) - temp-reserve-mb - swap-size-mb
        #   free space left on / afterwards == temp-reserve-mb
        # So temp-reserve-mb is the real root-fs headroom (the action's defaults
        # left only 100MB, which is what killed runs #5 and #7 at ~48 min: the
        # runner silently ran out of space and GitHub discarded all job logs).
        # 12288MB root headroom, 8192MB swap, ~115G build volume.
        root-reserve-mb: 16384
        temp-reserve-mb: 12288
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: aera-16-${{ github.event.inputs.DEVICE_NAME }}
        max-size: 4G
        create-symlink: true

    - name: Verify swap and disk layout
      run: |
        free -h
        swapon --show || true
        df -h /
        df -h "$GITHUB_WORKSPACE"
        mkdir -p "$GITHUB_WORKSPACE/.ccache"
        df -h "$GITHUB_WORKSPACE/.ccache"
        ROOT_AVAIL_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
        WS_AVAIL_MB=$(df --output=avail -m "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
        echo "root_avail_mb=${ROOT_AVAIL_MB} workspace_avail_mb=${WS_AVAIL_MB}"
        if [ "${ROOT_AVAIL_MB}" -lt 4096 ]; then
          echo "::error::only ${ROOT_AVAIL_MB}MB free on / - temp-reserve-mb did not take effect, the runner would die silently mid-build"
          exit 1
        fi
        if [ "${WS_AVAIL_MB}" -lt 60000 ]; then
          echo "::error::only ${WS_AVAIL_MB}MB on the build volume - too small for an AOSP tree"
          exit 1
        fi

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        find .repo/manifests -name "*.xml" -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} +
        find .repo/manifests -name "*.xml" -exec sed -i 's|git@github.com:|https://github.com/|g' {} +
        grep -n "remote name=\"AERA\"" .repo/manifests/twrp-default.xml || true
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags || repo sync -c -j4
        kill $TIP_PID 2>/dev/null || true
        echo "Removing .repo cache to free up ~20GB of disk space..."
        rm -rf .repo
        df -h

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build AERA Recovery
      id: build
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # ccache MUST live on the build volume. $HOME (/home/runner) is on the
        # runner's root filesystem, which has almost no space left after
        # maximize-build-space: writing up to 8GB there is what killed run #7.
        export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
        export CCACHE_EXEC=$(command -v ccache)
        export USE_CCACHE=1
        mkdir -p "$CCACHE_DIR"
        ccache -M 4G
        ccache -p | grep -E "^\(.*\) (cache_dir|max_size)"
        echo "Executing lunch twrp_${{ env.LUNCH_TARGET }}..."
        lunch twrp_${{ env.LUNCH_TARGET }}
        TIP_LOG="$RUNNER_TEMP/build-watchdog.log"
        DISK_ABORT="$RUNNER_TEMP/disk-abort"
        rm -f "$DISK_ABORT"
        (
          set +e
          while true; do
            printf '%s root=%sMB workspace=%sMB mem=%sMB\n' \
              "$(date -u +%T)" \
              "$(df --output=avail -m / | tail -1 | tr -d ' ')" \
              "$(df --output=avail -m "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')" \
              "$(free -m | awk '/^Mem:/ {print $7}')"
            ROOT_AVAIL=$(df --output=avail -m / | tail -1 | tr -d ' ')
            WS_AVAIL=$(df --output=avail -m "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
            ROOT_AVAIL=${ROOT_AVAIL:-999999}
            WS_AVAIL=${WS_AVAIL:-999999}
            if [ "$ROOT_AVAIL" -lt 1024 ] || [ "$WS_AVAIL" -lt 2048 ]; then
              echo "!!! disk exhaustion: root=${ROOT_AVAIL}MB workspace=${WS_AVAIL}MB at $(date -u)"
              echo "disk-abort" > "$DISK_ABORT"
              pkill -f soong_ui || true
              pkill -f ninja || true
            fi
            sleep 30
          done
        ) > "$TIP_LOG" 2>&1 &
        TIP_PID=$!
        set +e
        m ${{ github.event.inputs.BUILD_PARTITION }}image
        BUILD_RC=$?
        set -e
        kill $TIP_PID 2>/dev/null || true
        wait $TIP_PID 2>/dev/null || true
        echo "=== build watchdog tail ==="
        tail -n 30 "$TIP_LOG" || true
        if [ -f "$DISK_ABORT" ]; then
          echo "::error::build aborted early: disk exhaustion (see watchdog log above)"
          exit 1
        fi
        if [ $BUILD_RC -ne 0 ]; then
          echo "::error::m ${{ github.event.inputs.BUILD_PARTITION }}image failed with exit code $BUILD_RC"
          exit $BUILD_RC
        fi
        ccache -s
        mkdir -p out/artifacts
        find out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ -maxdepth 1 \( -name "*.img" -o -name "*.zip" \) -exec cp {} out/artifacts/ \;
        ls -l out/artifacts/

    - name: Diagnostics on failure
      if: failure()
      run: |
        echo "=== df -h ==="; df -h || true
        echo "=== df -i ==="; df -i || true
        echo "=== free -h ==="; free -h || true
        echo "=== swapon ==="; swapon --show || true
        echo "=== watchdog log tail ==="; tail -n 60 "$RUNNER_TEMP/build-watchdog.log" 2>/dev/null || true
        echo "=== space consumers ==="
        du -xh --max-depth=1 "$GITHUB_WORKSPACE" 2>/dev/null | sort -h | tail -20 || true
        du -sh "$GITHUB_WORKSPACE/.ccache" "$GITHUB_WORKSPACE/out" "$HOME/.cache" 2>/dev/null || true
        echo "=== kernel log tail ==="
        sudo dmesg -T 2>/dev/null | tail -60 || true
        sudo journalctl -k --no-pager 2>/dev/null | tail -40 || true
        echo "=== OOM evidence ==="
        sudo grep -iE "out of memory|oom-kill|no space left" /var/log/syslog 2>/dev/null | tail -20 || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA-Recovery-${{ github.event.inputs.DEVICE_NAME }}
        path: out/artifacts/*

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          out/artifacts/*
        name: AERA-Recovery-16.0-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
