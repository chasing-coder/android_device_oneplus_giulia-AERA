name: AERA Recovery 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "AERA manifest url"
        required: true
        default: "https://github.com/AERA-Recovery/android_manifest"
      TWRP_MANIFEST_BRANCH:
        description: "AERA branch"
        required: true
        default: "aera-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/cheng343/android_device_oneplus_giulia-AERA"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "aera-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "oneplus/giulia"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "giulia"
      LUNCH_TARGET:
        description: "lunch target (e.g. giulia-bp2a-eng)"
        required: false
        default: "giulia-bp2a-eng"
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    # Standard public runner: 4 vCPU / 16GB RAM / 145G root fs (no LVM, see the
    # "Reclaim disk and add temporary swap" step). The sibling AERA device
    # (cvhhji/android_device_oneplus_infiniti-AERA) builds Android 16 AERA
    # recovery on this exact image in ~90 minutes with 12G of extra swap, so the
    # wall we keep hitting is memory, not machine size.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
    steps:
    - name: Show build info
      run: |
        TARGET="${{ github.event.inputs.LUNCH_TARGET }}"
        if [ -z "$TARGET" ]; then
          TARGET="${{ github.event.inputs.DEVICE_NAME }}-bp2a-eng"
        fi
        TARGET="${TARGET#twrp_}"
        if [[ "$TARGET" != *-*-* ]]; then
          if [[ "$TARGET" == *-* ]]; then
            DEV="${TARGET%%-*}"
            VAR="${TARGET##*-}"
            TARGET="${DEV}-bp2a-${VAR}"
          else
            TARGET="${TARGET}-bp2a-eng"
          fi
        fi
        echo "LUNCH_TARGET=${TARGET}" >> "$GITHUB_ENV"

        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${TARGET}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo "Supported devices:"
          echo "- OnePlus Ace 5 / 13R (CN: PKG110 / GL: CPH2645 / IN: CPH2647)"
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    # Reclaim disk and add temporary swap
    #
    # No easimon/maximize-build-space and no LVM any more.
    #
      # Measured on this runner image (ubuntu-24.04): /dev/root is 145G with
      # ~135G free after the cleanup step, and /mnt is NOT a separate disk, so
      # the LVM dance bought nothing but a fragile ~100MB root filesystem - which
      # is what silently killed runs #5 and #7 at ~47 minutes (GitHub discards
      # the whole job log when the runner is lost, so there is no evidence).
      #
      # Build straight on /dev/root instead, and spend a slice of it on swap:
      # soong_build's single-process analysis phase wants far more than this
      # runner's 15.6GB of RAM (run #10: 5.2GB -> 11.5GB RSS in 30s and still
      # climbing; the runner was lost 30s later). The proven recipe of the
      # sibling AERA device (cvhhji/android_device_oneplus_infiniti-AERA, three
      # green Android 16 recovery builds) is exactly this: plain rm -rf for
      # space, then a 12G extra swapfile on top of the image's ~3G /swapfile,
      # then build in $HOME. We use 10G, giving ~13G of swap against 16G of RAM: a 16G
      # swapfile left only ~119G free on / and the 2026-10-13 sync filled the rest.
    - name: Reclaim disk and add temporary swap
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/share/boost /usr/share/swift || true
        df -h /
        sudo swapoff /swapfile-extra 2>/dev/null || true
        sudo rm -f /swapfile-extra
        sudo fallocate -l 10G /swapfile-extra || sudo dd if=/dev/zero of=/swapfile-extra bs=1M count=10240 status=none
        sudo chmod 600 /swapfile-extra
        sudo mkswap /swapfile-extra
        sudo swapon /swapfile-extra
        echo "=== memory / swap / disk after reclaim ==="
        free -h
        swapon --show
        df -h /

    - name: Verify swap and disk layout
      run: |
        free -h
        swapon --show || true
        df -h /
        df -h "$GITHUB_WORKSPACE"
        SWAP_TOT_MB=$(free -m | awk '/^Swap:/ {print $2}')
        echo "swap_total_mb=${SWAP_TOT_MB}"
        if [ "${SWAP_TOT_MB:-0}" -lt 8192 ]; then
          echo "::error::only ${SWAP_TOT_MB}MB of swap - soong_build's analysis phase needs that headroom (run #10 died there)"
          exit 1
        fi
        ROOT_AVAIL_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
        WS_AVAIL_MB=$(df --output=avail -m "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
        echo "root_avail_mb=${ROOT_AVAIL_MB} workspace_avail_mb=${WS_AVAIL_MB}"
        # Both are on /dev/root now (the LVM split is gone): the checked-out tree
        # is ~55G and out/ adds ~50G, so under 60G the runner would die silently
        # mid-build and take the job log with it.
        if [ "${ROOT_AVAIL_MB}" -lt 60000 ]; then
          echo "::error::only ${ROOT_AVAIL_MB}MB free on / - expected ~125000 after the 10G swapfile"
          exit 1
        fi
        if [ "${WS_AVAIL_MB}" -lt 60000 ]; then
          echo "::error::only ${WS_AVAIL_MB}MB on the workspace - too small for an AOSP tree"
          exit 1
        fi

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        # Same dependency set the proven sibling AERA workflow installs
        # (cvhhji/android_device_oneplus_infiniti-AERA), plus repo. The runner
        # image already ships most of it; this is insurance against a missing
        # host tool turning into an unexplained failure 40 minutes in.
        sudo apt install -y --no-install-recommends \
          repo bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev \
          lib32z1-dev libelf-dev libgl1-mesa-dev libncurses-dev libssl-dev libxml2 \
          libxml2-utils lz4 lzop openjdk-17-jdk pngcrush python3 python-is-python3 \
          rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com
        git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
        git config --global url."https://github.com/".insteadOf "git@github.com:"

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        find .repo/manifests -name "*.xml" -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} +
        find .repo/manifests -name "*.xml" -exec sed -i 's|git@github.com:|https://github.com/|g' {} +
        grep -n "remote name=\"AERA\"" .repo/manifests/twrp-default.xml || true
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune || repo sync -c -j4
        kill $TIP_PID 2>/dev/null || true
        echo "Removing .repo cache to free up ~20GB of disk space..."
        rm -rf .repo
        df -h

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Apply device patches
      run: |
        set -euo pipefail
        shopt -s nullglob
        PATCH_ROOT="$PWD/device/${{ github.event.inputs.DEVICE_PATH }}/patches"
        # Patches are grouped by the project they patch:
        #   patches/bootable/recovery/*.patch -> applied in bootable/recovery
        #   patches/vendor/recovery/*.patch   -> applied in vendor/recovery
        applied=0
        for patch in "$PATCH_ROOT"/*/*/*.patch; do
          rel="${patch#"$PATCH_ROOT"/}"
          target="${rel%/*.patch}"
          if [ ! -d "$target" ]; then
            echo "::error::$rel targets a directory that was not synced: $target"
            exit 1
          fi
          # 'repo sync' keeps each project's git dir inside .repo, and the Sync
          # source step deletes .repo, so the projects are bare work trees by
          # now. Plain 'git apply' needs no repository; drop the dangling .git
          # so git does not try to treat the directory as one.
          [ -d "$target/.git" ] || rm -f "$target/.git"
          echo "==> $rel"
          ( cd "$target" && git apply --stat "$patch" && git apply "$patch" ) || {
            echo "::error::failed to apply $rel"
            exit 1
          }
          applied=$((applied + 1))
        done
        if [ "$applied" -eq 0 ]; then
          echo "::error::no patches found under $PATCH_ROOT - refusing to build an unpatched recovery"
          exit 1
        fi
        echo "Applied $applied patch(es)."

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Open telemetry issue
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        BODY=$(cat <<EOF
        Live build telemetry for [run ${{ github.run_id }}](https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}).

        Why this exists: runs #5, #7 and #9 all reached ~47 minutes into the build step
        and then the runner disappeared, and GitHub **discards the whole job log** when a
        runner is lost, so those failures left no evidence at all. This thread is the only
        channel that survives, so the build log and the resource state are pushed here
        every 30 seconds.

        Safe to delete once the run is done.
        EOF
        )
        NUM=$(curl -sS -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
          --data-binary "$(jq -n --arg t "[telemetry] run ${{ github.run_id }} build log" --arg b "$BODY" '{title:$t, body:$b}')" | jq -r '.number')
        echo "TELEMETRY_ISSUE=$NUM" >> "$GITHUB_ENV"
        echo "telemetry issue: #$NUM"

    - name: Build AERA Recovery
      id: build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # These two are almost certainly useless here, and that is exactly why
        # they stay: upstream soong runs the build as
        # `cd / && env -i "$BUILDER" ...` with a hand-built environment
        # (android_build_soong ui/build/soong.go), so shell-level GOGC and
        # GOMEMLIMIT are dropped before soong_build ever starts. The watchdog
        # below dumps /proc/<pid>/environ to prove it either way. The only lever
        # that has actually moved the needle so far is swap (reclaim step).
        GOGC: "50"
        GOMEMLIMIT: "12GiB"
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # No ccache: the proven sibling recipe builds this tree in ~90 minutes
        # without it, and a cache_dir on a lost LVM volume was one more silent
        # failure mode (run #7).
        echo "Executing lunch twrp_${{ env.LUNCH_TARGET }}..."
        lunch twrp_${{ env.LUNCH_TARGET }}
        BUILD_LOG="$GITHUB_WORKSPACE/build.log"
        : > "$BUILD_LOG"
        TIP_LOG="$GITHUB_WORKSPACE/build-watchdog.log"
        DISK_ABORT="$GITHUB_WORKSPACE/disk-abort"
        rm -f "$DISK_ABORT"
        PEAK_FILE="$GITHUB_WORKSPACE/peak-mem.txt"
        : > "$PEAK_FILE"
        MEM_ABORT="$GITHUB_WORKSPACE/mem-abort"
        rm -f "$MEM_ABORT"
        ISSUE="${TELEMETRY_ISSUE:-}"
        echo "telemetry issue: ${ISSUE:-none}"
        echo "go tuning: GOGC=${GOGC:-unset} GOMEMLIMIT=${GOMEMLIMIT:-unset}"

        # ---- survive-the-runner-death telemetry ---------------------------
        # Run #10 proved the runner dies inside soong_build's analysis phase, and
        # GitHub throws the entire job log away when a runner is lost, so an
        # issue comment is the only channel that survives.
        (
          set +e
          OFF=0
          PEAK_RSS=0
          PEAK_NAME="?"
          LOW_MEM_TICKS=0
          SOONG_STATE=down
          START_EPOCH=$(date +%s)
          while true; do
            SIZE=$(stat -c %s "$BUILD_LOG" 2>/dev/null || echo 0)
            ROOT_MB=$(df --output=avail -m / | tail -1 | tr -d ' ')
            WS_MB=$(df --output=avail -m "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
            MEM_TOT=$(free -m | awk '/^Mem:/ {print $2}')
            MEM_AVAIL=$(free -m | awk '/^Mem:/ {print $7}')
            SWAP_USED=$(free -m | awk '/^Swap:/ {print $3}')
            SWAP_TOT=$(free -m | awk '/^Swap:/ {print $2}')
            SWAP_FREE=$(( ${SWAP_TOT:-0} - ${SWAP_USED:-0} ))
            TOPLINE=$(ps -eo pid=,rss=,comm= --sort=-rss | head -1)
            TOP_PID=$(echo "$TOPLINE" | awk '{print $1}')
            TOP_RSS_KB=$(echo "$TOPLINE" | awk '{print $2}')
            TOP_NAME=$(echo "$TOPLINE" | awk '{print $3}')
            TOP=$(ps -eo rss=,comm= --sort=-rss | head -3 | tr '\n' ';')
            if [ "${TOP_RSS_KB:-0}" -gt "$PEAK_RSS" ]; then
              PEAK_RSS=${TOP_RSS_KB:-0}
              PEAK_NAME=$TOP_NAME
              echo "$(date -u +%T) peak=${PEAK_RSS}KB comm=${PEAK_NAME}" >> "$PEAK_FILE"
            fi
            ELAPSED=$(( $(date +%s) - START_EPOCH ))
            GOENV=""
            if [ "$TOP_NAME" = "soong_build" ] && [ -r "/proc/$TOP_PID/environ" ]; then
              GOENV=$(tr '\0' '\n' < "/proc/$TOP_PID/environ" 2>/dev/null | grep -E '^(GOGC|GOMEMLIMIT)=' | tr '\n' ' ')
              if [ "$SOONG_STATE" = "down" ]; then
                echo "$(date -u +%T) soong_build analysis started (pid=$TOP_PID ${GOENV})" | tee -a "$TIP_LOG"
                SOONG_STATE=up
              fi
            elif [ "$SOONG_STATE" = "up" ] && ! pgrep -x soong_build >/dev/null 2>&1; then
              echo "$(date -u +%T) soong_build analysis no longer running, peak was ${PEAK_RSS}KB" | tee -a "$TIP_LOG"
              SOONG_STATE=down
            fi
            STAMP="$(date -u +%T) t=${ELAPSED}s root=${ROOT_MB}MB ws=${WS_MB}MB mem_avail=${MEM_AVAIL}MB/${MEM_TOT}MB swap=${SWAP_USED}/${SWAP_TOT}MB peak=${PEAK_RSS}KB(${PEAK_NAME}) log=${SIZE}B top=${TOP}"
            echo "$STAMP" >> "$TIP_LOG"
            echo "$STAMP"
            ROOT_AVAIL=${ROOT_MB:-999999}
            WS_AVAIL=${WS_MB:-999999}
            if [ "$ROOT_AVAIL" -lt 1024 ] || [ "$WS_AVAIL" -lt 2048 ]; then
              echo "!!! disk exhaustion: root=${ROOT_AVAIL}MB workspace=${WS_AVAIL}MB at $(date -u)"
              echo "disk-abort" > "$DISK_ABORT"
              pkill -f soong_ui || true
              pkill -f ninja || true
            fi
            if [ "${MEM_AVAIL:-99999}" -lt 200 ] && [ "$SWAP_FREE" -lt 512 ]; then
              LOW_MEM_TICKS=$((LOW_MEM_TICKS + 1))
            else
              LOW_MEM_TICKS=0
            fi
            if [ "$LOW_MEM_TICKS" -ge 4 ]; then
              echo "!!! memory exhaustion: mem_avail=${MEM_AVAIL}MB swap_free=${SWAP_FREE}MB peak=${PEAK_RSS}KB(${PEAK_NAME}) at $(date -u)"
              echo "mem-abort" > "$MEM_ABORT"
              pkill -f soong_build || true
              pkill -f soong_ui || true
            fi
            if [ -n "$ISSUE" ]; then
              {
                echo "### ${STAMP%% top=*}"
                [ -n "$GOENV" ] && echo "soong env: ${GOENV}"
                echo "top rss: ${TOP}"
                sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -3 || true
                if [ "$SIZE" -gt "$OFF" ]; then
                  echo '```'
                  tail -c +$((OFF + 1)) "$BUILD_LOG" | tail -c 20000
                  echo '```'
                  OFF=$SIZE
                fi
              } > "$RUNNER_TEMP/tel.md"
              jq -Rs '{body: .}' "$RUNNER_TEMP/tel.md" > "$RUNNER_TEMP/tel.json"
              curl -sS -o /dev/null -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
                --data-binary @"$RUNNER_TEMP/tel.json" || true
            fi
            sleep 30
          done
        ) > "$RUNNER_TEMP/telemetry-stdout.log" 2>&1 &
        TIP_PID=$!
        set +e
        mka adbd ${{ github.event.inputs.BUILD_PARTITION }}image 2>&1 | tee -a "$BUILD_LOG"
        BUILD_RC=${PIPESTATUS[0]}
        set -e
        kill $TIP_PID 2>/dev/null || true
        wait $TIP_PID 2>/dev/null || true
        if [ -n "$ISSUE" ]; then
          {
            echo "### FINAL rc=${BUILD_RC} log=$(stat -c %s "$BUILD_LOG" 2>/dev/null || echo 0)B at $(date -u +%T)"
            echo "peak memory observed: $(tail -1 "$PEAK_FILE" 2>/dev/null)"
            echo "disk/mem watchdog last line: $(tail -1 "$TIP_LOG" 2>/dev/null)"
            echo '```'
            tail -c 20000 "$BUILD_LOG"
            echo '```'
          } > "$RUNNER_TEMP/tel.md"
          jq -Rs '{body: .}' "$RUNNER_TEMP/tel.md" > "$RUNNER_TEMP/tel.json"
          curl -sS -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            --data-binary @"$RUNNER_TEMP/tel.json" || true
        fi
        echo "=== build watchdog tail ==="
        tail -n 30 "$TIP_LOG" || true
        echo "=== peak memory ==="
        tail -n 5 "$PEAK_FILE" || true
        if [ -f "$MEM_ABORT" ]; then
          echo "::error::build aborted early: memory exhaustion (peak $(tail -1 "$PEAK_FILE"))"
          exit 1
        fi
        if [ -f "$DISK_ABORT" ]; then
          echo "::error::build aborted early: disk exhaustion (see watchdog log above)"
          exit 1
        fi
        if [ $BUILD_RC -ne 0 ]; then
          echo "::error::m ${{ github.event.inputs.BUILD_PARTITION }}image failed with exit code $BUILD_RC"
          exit $BUILD_RC
        fi
        mkdir -p out/artifacts
        find out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ -maxdepth 1 \( -name "*.img" -o -name "*.zip" \) -exec cp {} out/artifacts/ \;
        ls -l out/artifacts/

    - name: Produce AVB-transplanted variant
      # The AOSP build signs recovery.img with the test key. The stock OnePlus
      # image carries a 2240-byte OEM-signed vbmeta (SHA256_RSA4096) in the same
      # "payload + vbmeta + zeros + AVBf footer" layout, so we can swap the
      # vbmeta and give the bootloader the vendor signature chain back. Both
      # variants ship: try -avb-oem.img first, fall back to the raw one (the
      # Ace 5 already accepted an unsigned TWRP image, so this may not even
      # matter), and D:\ace5\extracted\recovery.img is always the way home.
      continue-on-error: true
      run: |
        set -x
        DEV=device/${{ github.event.inputs.DEVICE_PATH }}
        IMG=out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img
        VB="$DEV/avb/recovery-vbmeta.bin"
        BASE=AERA-Recovery-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        ls -l "$IMG" "$VB"
        cp "$IMG" "out/artifacts/${BASE}-aosp-signed.img"
        python3 "$DEV/tools/transplant_avb.py" "$VB" "$IMG" "out/artifacts/${BASE}-avb-oem.img"
        (cd out/artifacts && sha256sum *.img > SHA256SUMS)
        cat out/artifacts/SHA256SUMS
        ls -l out/artifacts/

    - name: Diagnostics on failure
      if: failure()
      run: |
        echo "=== df -h ==="; df -h || true
        echo "=== df -i ==="; df -i || true
        echo "=== free -h ==="; free -h || true
        echo "=== swapon ==="; swapon --show || true
        echo "=== watchdog log tail ==="; tail -n 60 "$GITHUB_WORKSPACE/build-watchdog.log" 2>/dev/null || tail -n 60 "$RUNNER_TEMP/build-watchdog.log" 2>/dev/null || true
        echo "=== peak memory ==="; tail -n 30 "$GITHUB_WORKSPACE/peak-mem.txt" 2>/dev/null || true
        echo "=== go heap env ==="; echo "GOGC=${GOGC:-unset} GOMEMLIMIT=${GOMEMLIMIT:-unset}"; grep -c . "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
        echo "=== build log tail (last 60) ==="; tail -n 60 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
        tail -n 20000 "$GITHUB_WORKSPACE/build.log" > "$GITHUB_WORKSPACE/build-tail.log" 2>/dev/null || true
        tail -n 2000 "$GITHUB_WORKSPACE/build-watchdog.log" > "$GITHUB_WORKSPACE/watchdog-tail.log" 2>/dev/null || true
        echo "=== space consumers ==="
        du -xh --max-depth=1 "$GITHUB_WORKSPACE" 2>/dev/null | sort -h | tail -20 || true
        du -sh "$GITHUB_WORKSPACE/out" 2>/dev/null || true
        du -sh /swapfile-extra 2>/dev/null || true
        echo "=== kernel log tail ==="
        sudo dmesg -T 2>/dev/null | tail -60 || true
        sudo journalctl -k --no-pager 2>/dev/null | tail -40 || true
        echo "=== OOM evidence ==="
        sudo grep -iE "out of memory|oom-kill|no space left" /var/log/syslog 2>/dev/null | tail -20 || true

    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: aera-build-logs-${{ github.run_id }}
        path: |
          build-tail.log
          watchdog-tail.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AERA-Recovery-${{ github.event.inputs.DEVICE_NAME }}
        path: out/artifacts/*

    - name: Upload to Release
      # The build lands as an unpublished draft release: nothing shows up on the
      # public releases page (and nothing becomes "latest") until a human opens
      # the release and publishes it.
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: | 
          out/artifacts/*
        name: AERA-Recovery-16.0-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
